<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nino</title>

  <!-- Fonte e Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* ===== Estilo geral ===== */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom right, #E8F5E9, #CBEED0, #AEE3B7, #9ADBA8 , #88D19D);
      font-family: 'Cinzel Decorative', serif;
      
    }

    /* ===== Container principal ===== */
    .welcome-container {
      text-align: center;
      color: #33691E;
      animation: fadeIn 1.5s ease-in-out;
    }

    /* ===== Texto ===== */
    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1rem;
      font-style: italic;
      color: #1B5E20;
      margin-bottom: 30px;
    }

    /* ===== Botão ===== */
    .btn-nino {
      background-color: #1B5E20;
      color: white;
      border-radius: 25px;
      padding: 10px 30px;
      font-size: 1.2rem;
      transition: background-color 0.3s ease;
    }

    .btn-nino:hover {
      background-color: #1B5E20;
    }

    /* ===== Animações ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Responsivo ===== */
    @media (max-width: 600px) {
      h1 { font-size: 2.3rem; }
      p { font-size: 1rem; } 
    }


  </style>
</head>

<body>
  <div class="welcome-container">
    <div class="fundo">
      <img src="img/logo_sem_fundo.png" alt="Logo Nino" style="height: auto; width: 40%">
    </div>
    <h1>Nino</h1>
    <p>Seu conforto do dia.</p>
    <a href="início.html" class="btn btn-nino"><img src="img/plantinha_icon.png" alt="[icon]" style="height: auto; width:2%">Entrar</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
